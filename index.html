<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra historia juntos</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Fondo dinámico puramente en CSS -->
    <div class="background-animation"></div>

    <main class="app-container">
        <header class="app-header">
            <h1>Nuestra historia juntos 🐾</h1>
            <p>Registra de manera segura los momentos más felices y divertidos con tu mascota.</p>
        </header>

        <!-- Fase 1: Formulario interactivo con estructura semántica -->
        <section class="form-section">
            <div class="form-header">
                <!-- Imagen decorativa tipo caricatura/ilustración (SVG inline o URL de servicio) -->
                <img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff9aafff'%3E%3Cpath d='M12 2c-3.3 0-6 2.7-6 6 0 1.2.3 2.3.9 3.3.4.6 1.4.9 2.2.6 1-.3 1.5-1.5.9-2.5C9.4 8.5 9 7.3 9 6c0-1.7 1.3-3 3-3s3 1.3 3 3c0 1.3-.4 2.5-1 3.4-.6 1-.1 2.2.9 2.5.8.3 1.7 0 2.2-.6.5-1 .9-2.1.9-3.3 0-3.3-2.7-6-6-6zm-4.5 13.5c-1 0-2 .2-2.9.6-.8.4-1.3 1.2-1.3 2.1v.3c0 2 1.3 3.8 3.2 4.3 1.7.4 3.6.4 5.3 0 1.9-.5 3.2-2.3 3.2-4.3v-.3c0-.9-.5-1.7-1.3-2.1-.9-.4-1.9-.6-2.9-.6-1 0-2.1.2-3.3.61-1.2-.41-2.3-.61-3.3-.61z'/%3E%3C/svg%3E" 
                     alt="Ilustración Mascota" 
                     class="form-deco-img">
                <h2>Añadir un nuevo hito</h2>
            </div>
            
            <form id="milestone-form" novalidate>
                <div class="input-group">
                    <input type="text" id="petName" required placeholder=" ">
                    <label for="petName">Nombre de la Mascota</label>
                    <span class="error-msg" id="error-petName"></span>
                </div>

                <div class="input-group">
                    <input type="date" id="eventDate" required placeholder=" ">
                    <label for="eventDate">Fecha del Evento</label>
                    <span class="error-msg" id="error-eventDate"></span>
                </div>

                <div class="input-group">
                    <select id="eventType" required>
                        <option value="" disabled selected></option>
                        <option value="nacimiento">Nacimiento / Adopción</option>
                        <option value="logro">Primer Logro</option>
                        <option value="viaje">Viaje / Paseo</option>
                        <option value="cumpleanos">Cumpleaños</option>
                        <option value="travesura">Travesura</option>
                    </select>
                    <label for="eventType">Tipo de Evento</label>
                    <span class="error-msg" id="error-eventType"></span>
                </div>

                <div class="input-group">
                    <textarea id="eventDesc" rows="3" required placeholder=" "></textarea>
                    <label for="eventDesc">Descripción del Momento</label>
                    <span class="error-msg" id="error-eventDesc"></span>
                </div>

                <button type="submit" class="btn-submit">Guardar en la Línea de Tiempo</button>
            </form>
        </section>

        <!-- Fase 1: Contenedor semántico para la línea de tiempo -->
        <section id="timeline" class="timeline-section" aria-live="polite">
            <!-- Las tarjetas de hitos se inyectarán aquí dinámicamente -->
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
